version: '3.8'

services:
  # PostgreSQL with pgvector for Document Embeddings & Financial Records
  db:
    image: pgvector/pgvector:pg16
    container_name: findoc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: findoc_db
      POSTGRES_USER: findoc
      POSTGRES_PASSWORD: findoc_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findoc -d findoc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery Task Broker & Caching
  redis:
    image: redis:7-alpine
    container_name: findoc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Django REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findoc_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python scripts/seed_demo_data.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=prod-secret-fintech-key-findoc-ai
      - DATABASE_URL=postgres://findoc:findoc_password@db:5432/findoc_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery Asynchronous Worker for OCR & AI Pipeline
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findoc_celery
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      - DATABASE_URL=postgres://findoc:findoc_password@db:5432/findoc_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - backend
      - redis

  # Next.js 15 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: findoc_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
